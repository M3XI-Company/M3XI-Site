<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Argos — the robot forge · M3XI</title>
<meta name="description" content="Argos by M3XI. Bring a sketch; Argos forges a printable companion robot with its own personality, for non-lethal sumo arena play." />
<meta name="theme-color" content="#030607" />
<link rel="icon" type="image/png" href="/M.png" />
<!-- Leave empty to run Argos fully in the browser at no cost. Set it to the
     deployed supabase/functions/argos-chat URL to give Argos a model. -->
<meta name="argos-endpoint" content="" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@300;400;500&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./argos.css" />
</head>
<body>
<div class="scan" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="/argos/">
    <span class="brand-mark">ARGOS</span>
    <span class="brand-by">a forge by <b>M3XI</b></span>
  </a>
  <nav class="top-links">
    <a href="#law" data-panel="law">Law</a>
    <a href="#library" data-panel="library">Library</a>
    <a href="/argos/pilot/">Pilot app ↗</a>
  </nav>
  <div class="clock"><span id="clock">--:--:--</span><small id="date"></small></div>
</header>

<main class="hud">
  <aside class="panel left" aria-label="Your robot">
    <section class="card">
      <h2><span class="dot"></span>Bay</h2>
      <div id="robot-card" class="robot-empty">
        <p>No robot forged.</p>
        <p class="muted">One pilot, one robot. Describe it below, or attach a sketch.</p>
      </div>
    </section>
    <section class="card gauges">
      <h2><span class="dot"></span>Forge</h2>
      <div class="gauge"><span>Link</span><b id="g-link">LOCAL</b></div>
      <div class="gauge"><span>Voice</span><b id="g-voice">—</b></div>
      <div class="gauge"><span>Parts filed</span><b id="g-parts">0</b></div>
      <div class="gauge"><span>Protection</span><b>CREATOR&nbsp;SEALED</b></div>
    </section>
  </aside>

  <section class="core">
    <div class="orb-wrap">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div class="orb-label"><span id="orb-state">STANDING BY</span></div>
    </div>
    <ol id="log" class="log" aria-live="polite"></ol>
  </section>

  <aside class="panel right" aria-label="Law and library">
    <section class="card" id="law">
      <h2><span class="dot gold"></span>The Law</h2>
      <ol id="law-list" class="law"></ol>
    </section>
    <section class="card" id="library">
      <h2><span class="dot"></span>Library</h2>
      <ul id="lib" class="lib"><li class="muted">Empty.</li></ul>
    </section>
  </aside>
</main>

<form id="ask" class="ask" autocomplete="off">
  <label class="icon-btn" title="Attach a sketch or schematic">
    <input id="file" type="file" accept="image/*,.pdf,.svg,.stl,.step,.stp,.dxf" hidden />
    <svg viewBox="0 0 24 24"><path d="M16.5 6.5 8 15a2.5 2.5 0 0 0 3.5 3.5l8.5-8.5a4.5 4.5 0 0 0-6.4-6.4L5 12.2a6.5 6.5 0 0 0 9.2 9.2L21 14.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </label>
  <div class="field">
    <span class="prompt">argos://</span>
    <input id="q" type="text" placeholder="build me a small tracked wedge bot that parries…" aria-label="Message Argos" />
    <span id="chip" class="chip" hidden></span>
  </div>
  <button type="button" id="mic" class="icon-btn" title="Speak to Argos">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <button type="button" id="voice" class="icon-btn on" title="Argos speaks aloud" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <button class="send" type="submit">Transmit</button>
</form>

<script type="module" src="./main.js"></script>
</body>
</html>
