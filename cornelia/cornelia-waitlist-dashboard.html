<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cornelia Waitlist — Tracker</title>
<link rel="icon" type="image/png" href="/M.png" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js" integrity="sha384-/XXDzxe4FsGiAe50i/u9pY/Vy/uX654MHB1xoc1BJNnH1WXHhqHga9g3q5tF4gj7" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css" integrity="sha384-jZvDSsmGB9oGGT/4l9bHXGoAv1OxvG/cFmSo0dZaSqmBgvQTKDBFAMftlXTmMbNW" crossorigin="anonymous">
<style>
  :root{ color-scheme: light;
    --ink:#16140F; --ivory:#F7F3EC; --paper:#FFFFFF; --gold:#C29B43;
    --mute:#7A746A; --line:rgba(22,20,15,.12); --soft:#FBF8F2;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ivory); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.5;}
  .wrap{max-width:1000px; margin:0 auto; padding:24px 22px 60px}
  .head{display:flex; align-items:center; gap:14px; margin:4px 0 22px}
  .head .mk{width:46px;height:46px;flex:none}
  .head h1{font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:26px; margin:0; letter-spacing:-.01em}
  .head p{margin:2px 0 0; color:var(--mute); font-size:13px}
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px 20px}
  .card .k{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:0 0 8px}
  .card .v{font-family:'Playfair Display',serif; font-weight:600; font-size:34px; line-height:1}
  .card .v small{font-size:14px; color:var(--mute); font-weight:400; font-family:'Inter',sans-serif; margin-left:6px}
  .panel{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:18px}
  .panel h2{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:0 0 14px; font-weight:600}
  .bar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
  .btn{font:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--soft);
    border:1px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer}
  .btn:hover{border-color:var(--gold)}
  #chartBox{position:relative; height:230px}
  .empty{text-align:center; color:var(--mute); padding:38px 10px}
  .empty .big{font-family:'Playfair Display',serif; font-size:22px; color:var(--ink); margin-bottom:6px}
  .err{background:#fdecec; border:1px solid #f3c9c9; color:#9b3030; padding:12px 14px; border-radius:12px; font-size:13px; margin-bottom:16px; display:none}
  .gridjs-wrapper{box-shadow:none; border-radius:10px}
  table.gridjs-table{font-size:13px}
  .gridjs-th{background:var(--soft)}
  .loading{color:var(--mute); font-size:13px; padding:20px 2px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:middle}
  .status-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:#eef2ee;color:#2f6b46}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="mk" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Cornelia">
      <rect x="16" y="16" width="480" height="480" rx="116" fill="#FBF8F2" stroke="#C29B43" stroke-opacity=".45" stroke-width="3"/>
      <path d="M 320.65 152.54 A 122 122 0 1 0 320.65 359.46" fill="none" stroke="#16140F" stroke-width="56"/>
      <line x1="206" y1="256" x2="372" y2="256" stroke="#C29B43" stroke-width="11" stroke-linecap="round"/>
      <circle cx="372" cy="256" r="13" fill="#16140F"/>
    </svg>
    <div>
      <h1>Cornelia Waitlist</h1>
      <p id="sub">Live from Supabase · NoteTaker project</p>
    </div>
  </div>

  <div class="err" id="err"></div>
  <div id="loading" class="loading"><span class="dot"></span>Loading waitlist…</div>

  <div id="content" style="display:none">
    <div class="cards">
      <div class="card"><p class="k">Total signups</p><div class="v" id="m-total">0</div></div>
      <div class="card"><p class="k">Last 7 days</p><div class="v" id="m-week">0</div></div>
      <div class="card"><p class="k">Most recent</p><div class="v" id="m-recent" style="font-size:18px;line-height:1.3">—</div></div>
    </div>

    <div class="panel">
      <h2>Signups per day</h2>
      <div id="chartBox"><canvas id="chart"></canvas></div>
    </div>

    <div class="panel">
      <div class="bar">
        <h2 style="margin:0">Signups</h2>
        <button class="btn" id="csv">Export CSV</button>
      </div>
      <div id="table"></div>
      <div class="empty" id="empty" style="display:none">
        <div class="big">No signups yet</div>
        <div>When someone joins the Cornelia waitlist, they'll appear here. Hit Reload after a test signup.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const TOOL = 'mcp__335ed154-b225-4a44-b85a-101d18f65730__execute_sql';
  const PROJECT_ID = 'nfdegwfgrlikmmzakxqw';
  const QUERY = "select email, coalesce(name,'') as name, coalesce(source,'') as source, status, " +
                "to_char(created_at at time zone 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"') as created_at " +
                "from public.waitlist where product = 'cornelia' order by created_at desc limit 5000;";

  let ROWS = [];

  function esc(s){ return String(s==null?'':s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function parseResult(r){
    let payload = r && (r.structuredContent ?? r);
    if (payload && payload.content && Array.isArray(payload.content) && payload.content[0] && payload.content[0].text){
      try { payload = JSON.parse(payload.content[0].text); } catch(e){ payload = payload.content[0].text; }
    }
    let text = typeof payload === 'string' ? payload : (payload && payload.result != null ? payload.result : JSON.stringify(payload));
    const m = String(text).match(/<untrusted-data[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data[^>]*>/);
    const jsonStr = m ? m[1] : text;
    try { const v = JSON.parse(jsonStr); return Array.isArray(v) ? v : (v.rows || v.data || []); }
    catch(e){ return []; }
  }

  function fmt(dtIso){
    if(!dtIso) return '—';
    const d = new Date(dtIso);
    if(isNaN(d)) return esc(dtIso);
    return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function dayKey(dtIso){ return (dtIso||'').slice(0,10); }

  function render(){
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';

    const total = ROWS.length;
    const now = Date.now();
    const week = ROWS.filter(r => (now - new Date(r.created_at).getTime()) <= 7*864e5).length;
    document.getElementById('m-total').textContent = total.toLocaleString();
    document.getElementById('m-week').innerHTML = week.toLocaleString() + ' <small>new</small>';
    document.getElementById('m-recent').textContent = total ? fmt(ROWS[0].created_at) : '—';
    document.getElementById('sub').textContent = 'Live from Supabase · NoteTaker project · ' + total + ' on the list';

    const byDay = {};
    ROWS.forEach(r => { const k = dayKey(r.created_at); if(k) byDay[k]=(byDay[k]||0)+1; });
    const days = Object.keys(byDay).sort();
    const labels = days.map(d => new Date(d+'T00:00:00Z').toLocaleDateString(undefined,{month:'short',day:'numeric'}));
    const data = days.map(d => byDay[d]);

    const empty = document.getElementById('empty');
    if(total === 0){
      empty.style.display='block';
      document.getElementById('table').style.display='none';
      document.getElementById('csv').style.display='none';
    }

    if(days.length){
      const ctx = document.getElementById('chart').getContext('2d');
      new Chart(ctx, {
        type:'bar',
        data:{ labels, datasets:[{ label:'Signups', data, backgroundColor:'#C29B43', borderRadius:6, maxBarThickness:34 }]},
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false}, tooltip:{backgroundColor:'#16140F'}},
          scales:{ y:{beginAtZero:true, ticks:{precision:0}, grid:{color:'rgba(22,20,15,.06)'}},
                   x:{grid:{display:false}} } }
      });
    } else {
      document.getElementById('chartBox').innerHTML = '<div class="empty">No data to chart yet.</div>';
    }

    if(total){
      new gridjs.Grid({
        columns:[
          {name:'Joined', formatter:(c)=>gridjs.html('<span>'+esc(fmt(c))+'</span>')},
          'Email',
          'Name',
          'Source',
          {name:'Status', formatter:(c)=>gridjs.html('<span class="status-pill">'+esc(c)+'</span>')}
        ],
        data: ROWS.map(r => [r.created_at, r.email, r.name||'—', r.source||'—', r.status||'pending']),
        search:true, sort:true, pagination:{enabled:true, limit:12}
      }).render(document.getElementById('table'));
    }
  }

  function toCSV(){
    const header = ['email','name','source','status','created_at'];
    const lines = [header.join(',')].concat(ROWS.map(r =>
      header.map(h => '"'+String(r[h]==null?'':r[h]).replace(/"/g,'""')+'"').join(',')));
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cornelia-waitlist-'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
  }

  async function load(){
    try{
      const r = await window.cowork.callMcpTool(TOOL, { project_id: PROJECT_ID, query: QUERY });
      if(r && r.isError){ throw new Error((r.content && r.content[0] && r.content[0].text) || 'Tool error'); }
      ROWS = parseResult(r);
      render();
    }catch(e){
      document.getElementById('loading').style.display='none';
      const el = document.getElementById('err');
      el.style.display='block';
      el.textContent = 'Could not load the waitlist: ' + (e && e.message ? e.message : e);
    }
  }

  document.getElementById('csv').addEventListener('click', toCSV);
  load();
</script>
</body>
</html>
